<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Tutor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ace-builds@1.44.0/css/ace.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='code-styles.css')}}">
    <style>
        #editor-above p {
            --before-image-src: none;
        }
        #editor-above p::before {
            content: "";
            background-image: var(--before-image-src);
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 5px;
            vertical-align: middle;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>
<body data-conversation-id= "{% if history %}{{ conversation_id }}{% endif %}" data-program="{% if program %}{{ program }}{% endif %}">
    <div id="top"><button id="logout-button">Log out</button></div>
    <div id="code">
        <div id="editor-above">
<p data-loading-icon="{{url_for('static', filename='loader.gif')}}" data-saved-icon="{{url_for('static', filename='saved-icon.svg')}}"></p>
<label for="update-html-preview-checkbox" title="Automatically update the code preview every single time you stop typing.">Update Preview Automatically: </label>
<input type="checkbox" id="update-html-preview-checkbox" checked>
<label for="autosave-program-checkbox" title="Automatically save your code every time you stop typing.">Autosave your work:</label>
<input type="checkbox" id="autosave-program-checkbox" checked>
<button id="save-program-button" disabled>Save</button>
<button id="update-html-preview-button" disabled>Update HTML</button>
        </div>
        <div id="editor"></div>
        <div id="html-preview-container">
            <iframe frameborder="0" id="html-preview" srcdoc="" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>
    </div>
    <div id="chat">
        <div id="messages-container">
            <!-- {% set md = Markdown() %} -->
            <!-- {% for prompt, reply in history: %} -->
            <div class="message user-message">{{ prompt }}</div>
            <div class="message ai-message">{{ md.render(reply) | safe}}</div>
            <!-- {% endfor %} -->
        </div>
        <button id="new-chat-button">Create New Chat</button>
        <form id="message-form">
            <textarea id="message-input" aria-label="Ask your question here..." placeholder="Type your prompt here..." rows="3" required aria-></textarea><br>
            <button type="submit">Send</button>
        </form>
    </div>
    <div id="error-div" style="display: none;"><button id="close-error-div">&#10005;</button><p></p></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.44.0/src-min-noconflict/ace.min.js"></script>
    <script>
"use strict";
let globals = {
    conversationId:
    $("body").attr("data-conversation-id").trim() ? $("body").attr("data-conversation-id").trim() : null
    ,
};
/* You've probably noticed something- there are two copies of the conversation id; one in JavaScript and one in HTML.
The HTML one is only for Jinja to manipulate at the load of the page. Afterward, JavaScript handles the rest. I didn't put Jinja directly in JavaScript because then my IDE throws an error; it's not native JavaScript syntax. And my IDE's Jinja mode is nowhere near as excellent as its HTML mode.
*/
let editor = ace.edit("editor");
editor.setTheme("ace/theme/dawn");
editor.session.setMode("ace/mode/html")
editor.resize();
editor.setOptions({
    fontSize: "16px",
    fontFamily: "Courier New, Courier, monospace",
    showPrintMargin: false,
    wrap: true,
});
function debounce(func, timeout) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => { func.apply(this, args)}, timeout)
    }
}
function showPreview() {
    $("#error-div").hide();
    $("#error-div p").text("")
    const errorScript = `
<script>
window.onerror = function (message, source, lineno, colno, error) {
if (message === "Script error." && lineno === 0) {
    /* An external library did it, but we don't know what it is. */
    window.parent.postMessage("Cross-Origin Script Error: A script loaded from an external CDN crashed, but the error details are hidden for security reasons. To show the error, add 'crossorigin=\\"anonymous\\"' to your <script> tag.", "*");
} else {
    window.parent.postMessage(\`\${message}: at \${source}. At line \${lineno} column \${colno}.\`, "*");
};
console.log("Message posted successfully!");
}; 
window.onunhandledrejection = function (event) {
if (!event.reason || /Script error\\./i.test(event.reason)) {
    window.parent.postMessage("Cross-Origin Script Error: A script loaded from an external CDN crashed with an unhandled rejected Promise, but the error details are hidden for security reasons. To show the error, add 'crossorigin=\\"anonymous\\"' to your <script> tag.", "*");
} else {
    window.parent.postMessage("Unhandled promise rejection: " + event.reason, "*");
};
console.log("Promise rejected- Message posted successfully!")
}; 
<\/script>
    `.replaceAll("\n", " ")
    // This script sends all errors directly to the main script, which will then show it to the user.
    const newValue = editor.getValue()
    $("#html-preview").attr("srcdoc", errorScript + "<base target='_blank'>" + newValue);
    // That way if the create a link then the <base> will redirect them to a new tab and not destroy the iframe.
    const previewTimeoutId = setTimeout(() => {
        $("#html-preview-container").append($("#html-preview").remove().attr("srcdoc", ""));
        $("#error-div p").text("Your code took too much time, so we halted it. That's all we know.");
        $("#error-div").show();
    }, 5000)
    $("#html-preview")[0].onload = function () {
        clearTimeout(previewTimeoutId);
    }
}
async function saveProgram () {
    const $p = $("#editor-above p");
    $p.css("--before-image-src", `url("${$p.attr("data-loading-icon")}")`)
    $p.text("Saving...");
    await fetch("/api/save-program", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            code:editor.getValue(),
        }),
    });
    $p.css("--before-image-src", `url("${$p.attr("data-saved-icon")}")`)
    $p.text("Saved!");
    editor.session.off("change", "programSavingUIDebouncer");
    editor.session.on("change", function programSavingUIDebouncer () {
        $p.css("--before-image-src", "none").text("")
    });
}
const editorOnChange = debounce(function () {
    if ($("#update-html-preview-checkbox")[0].checked) {
        showPreview();
    }
    if ($("#autosave-program-checkbox")[0].checked) {
        saveProgram();
    }
}, 500);
editor.session.on("change", function () {
    editorOnChange();
});
/*
Normally, when a keyboard user tabs inside the ace editor, they can't get out! Ace treats it like they're just adding an indent. That's why this keyboard shortcut exists.
*/
editor.commands.addCommand({
    name:"escapeEditor",
    bindKey:{"win":"Esc", "mac":"Esc"},
    exec:function () {
        $("#html-preview")[0].focus();
    }
});
$("#autosave-program-checkbox").on("change", function () {
    if (this.checked) {
        $("#save-program-button").prop("disabled", true);
    } else {
        $("#save-program-button").prop("disabled", false);
    }
});
$("#update-html-preview-checkbox").on("change", function () {
    if (this.checked) {
        $("#update-html-preview-button").prop("disabled", true);
    } else {
        $("#update-html-preview-button").prop("disabled", false);
    }
});
$("#save-program-button").on("click", saveProgram);
$("#update-html-preview-button").on("click", showPreview);
window.addEventListener("message", function (event) {
    console.log("Received message successfully!")
    if (event.source !== $("#html-preview")[0].contentWindow) {
        console.warn("Received suspicious message from an iframe that doesn't match. Information: ", event);
        return;
    }
    const errorMessage = event.data;
    $("#error-div p").text(errorMessage);
    $("#error-div").show();
});
$("#close-error-div").on("click", function () {
    $("#error-div").hide();
    $("#error-div p").text("")
});
editor.setValue($("body").attr("data-program"));
$("body").attr("data-program", "")
function addMessageToChat(message, isFromHuman) {
    const newEl = $(`
<div class="message ${isFromHuman ? 'user-message' : 'ai-message'}"></div>
    `)
    if (isFromHuman) {
        // The human likely didn't want to turn it to html.
        newEl.text(message);
    } else {
        // However, the ai definitely put the html entities on purpose.
        newEl.html(message);
    }
    newEl.appendTo("#messages-container");
}
$("#message-input").on("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
        // We want to submit it if they press enter, but add a newline like the default behavior if it is shift+enter.
        event.preventDefault();
        $("#message-form").trigger("submit");
    }
})
$("#message-form").on("submit", async function (event) {
    event.preventDefault();
    const value = $("#message-input").val();
    const container = $("#messages-container")[0]
    addMessageToChat(value, true);
    $("#message-input").val("");
    // Scroll to the bottom automatically, to the end of the message.
    setTimeout(() => {
        container.scrollBy({
            top:container.scrollHeight,
            left: 0,
            behavior:"smooth",
        });
    }, 10)
    try {
        const rawResponse = await fetch("/api/chat", {
            method: $("#messages-container").children().length < 2 ? "POST" : "PATCH",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({message:value, code:editor.getValue(), id:globals.conversationId}),
        });
        if (!rawResponse.ok) {
            throw new Error(`HTTP Error! Status: ${rawResponse.status}.`);
        }
        const response = await rawResponse.json();
        if (!response.message) {
            throw new Error("Response empty.");
        }
        globals.conversationId = response.id
        addMessageToChat(response.message, false);
        // Scroll again so that the AI message from the top is visible, so they can start reading.
        container.scrollBy({
            top:container.offsetHeight, // Since we earlier scrolled so that the user message is at the bottom, scroll the height of the container so that the message is now at the top.
            left: 0,
            behavior:"smooth",
        });
    } catch (error) {
        console.error(error);
    }
});
$("#new-chat-button").on("click", async function () {
    $("#messages-container").empty();
    $("body").removeAttr("data-conversation-id");
    globals.conversationId = null;
    await fetch("/api/chat", {
        method:"DELETE"
    })
})
$("#logout-button").on("click", async function () {
    const rawResponse = await fetch("/api/logout", {
        method:"DELETE",
    });
    const response = await rawResponse.json();
    if (response.redirect) {
        window.location.href = response.link;
    }
})
    </script>
</body>
</html>
