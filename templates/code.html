<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Tutor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ace-builds@1.44.0/css/ace.min.css">
    <style>
        :root {
            --chat-background-color: rgb(200, 200, 200);
            --user-message-color: rgb(141, 255, 249);
            --ai-message-color: rgb(122, 255, 140);
            --chat-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }
        #chat {
            width: 30%;
            height: var(--chat-height);
            max-height: var(--chat-height);
            min-height: var(--chat-height);
            background-color: var(--chat-background-color);
            padding: 10px;
            position: absolute;
            right: 0px;
            top: 0px;
            box-sizing: border-box;
        }
        #messages-container {
            height: calc(var(--chat-height) * 0.95);
            overflow-y: auto;
        }
        .user-message {
            margin-left: 10px;
            margin-right: auto;
            background-color: var(--user-message-color);
            white-space: pre-wrap;
        }
        .ai-message {
            margin-right: 10px;
            margin-left: auto;
            background-color: var(--ai-message-color);
 
        }
        .user-message, .ai-message {
            width: max-content;
            max-width: 80%;
            border: 2px solid black;    
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 5px;
            overflow-wrap: break-word;
        }
        #message-form {
            position: absolute;
            bottom: 0%;
            width: 100%;
        }
        #message-input {
            border-radius: 5px;
            min-width: 90%;
            margin-left: auto;
            margin-right: auto;
            resize: none;
            field-sizing: content;
            max-height: 20vh;
            font-family: inherit;
            font-size: 1rem;
        }
        code {
            white-space: pre-wrap;
        }
        #editor {
            width: 50%;
            height: 100%;
            position: relative;
        }
        #code {
            height: 100%;
            width: 70%;
            position: absolute;
            left: 0px;
            top: 0px;
            box-sizing: border-box !important;
        }
        .ace_gutter {
            background-color: rgb(180, 180, 180) !important;
        }
        .ace_gutter-active-line {
            background-color: rgb(200, 200, 200) !important;
        }
        .ace_content {
            background-color: rgb(233, 233, 233) !important;
        }
        #html-preview {
            position: absolute;
            left: 50%;
            width: 50%;
            height: 100%;
            top: 0px;
        }
    </style>
</head>
<body data-conversation-id= "{% if history %}{{ conversation_id }}{% endif %}"
>
    <div id="code">
        <div id="editor"></div>
        <iframe frameborder="0" id="html-preview" srcdoc="" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
    <div id="chat">
        <div id="messages-container">
            <!-- {% set md = Markdown() %} -->
            <!-- {% for prompt, reply in history: %} -->
            <div class="message user-message">{{ prompt }}</div>
            <div class="message ai-message">{{ md.render(reply) | safe}}</div>
            <!-- {% endfor %} -->
        </div>
        <form id="message-form">
            <textarea id="message-input" aria-label="Ask your question here..." placeholder="Type your prompt here..." rows="3"></textarea><br>
            <button type="submit">Send</button>
        </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.44.0/src-min-noconflict/ace.min.js"></script>
    <script>
"use strict";
let globals = {
    conversationId:
    $("body").attr("data-conversation-id").trim() ? $("body").attr("data-conversation-id").trim() : null
    ,
};
let editor = ace.edit("editor");
editor.setTheme("ace/theme/dawn");
editor.session.setMode("ace/mode/html")
editor.resize();
editor.setOptions({
    fontSize: "16px",
    fontFamily: "Courier New, Courier, monospace",
    showPrintMargin: false,
    wrap: true,
});
editor._$emitInputEvent.schedule(500);
editor.on("input", function () {
    // This event fires with a slight 50ms debounce effect, so we don't need to manually create one.
    $("#html-preview")[0].srcdoc = "<base target='_blank'>" + editor.getValue();
// Notice how I prepend the base tag so that the link doesn't open directly inside the iframe and crash it.
});
function addMessageToChat(message, isFromHuman) {
    const newEl = $(`
<div class="message ${isFromHuman ? 'user-message' : 'ai-message'}"></div>
    `)
    if (isFromHuman) {
        // The human likely didn't want to turn it to html.
        newEl.text(message);
    } else {
        // However, the ai definitely put the html entities on purpose.
        newEl.html(message);
    }
    newEl.appendTo("#messages-container");
}
$("#message-input").on("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
        // We want to submit it if they press enter, but add a newline like the default behavior if it is shift+enter.
        event.preventDefault();
        $("#message-form").trigger("submit");
    }
})
$("#message-form").on("submit", async function (event) {
    event.preventDefault();
    const value = $("#message-input").val();
    const container = $("#messages-container")[0]
    addMessageToChat(value, true);
    $("#message-input").val("");
    // Scroll to the bottom automatically, to the end of the message.
    setTimeout(() => {
        container.scrollBy({
            top:container.scrollHeight,
            left: 0,
            behavior:"smooth",
        });
    }, 10)
    try {
        const rawResponse = await fetch($("#messages-container").children().length < 2 ? "/api/create-chat" : "/api/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({message:value, code:editor.getValue(), id:globals.conversationId}),
        });
        if (!rawResponse.ok) {
            throw new Error(`HTTP Error! Status: ${rawResponse.status}.`);
        }
        const response = await rawResponse.json();
        if (!response.message) {
            throw new Error("Response empty.");
        }
        globals.conversationId = response.id
        addMessageToChat(response.message, false);
        // Scroll again so that the AI message from the top is visible, so they can start reading.
        container.scrollBy({
            top:container.offsetHeight, // Since we earlier scrolled so that the user message is at the bottom, scroll the height of the container so that the message is now at the top.
            left: 0,
            behavior:"smooth",
        });
    } catch (error) {
        console.error(error);
    }
    
});
    </script>
</body>
</html>
