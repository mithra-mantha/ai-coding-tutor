<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        #result {
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
        }
        .python-error {
            color: red;
        }
    </style>
</head>

<body>
    <pre><div id="result"></div></pre>
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
    <script>
(async () => {
    window.pyodide = await loadPyodide({
        stdout:(text) => {
            $("#result").append($("<div class='python-output'></div>").text(text))
        },
    });
})();
function onPythonError(error) {
    $("#result").append($("<div class='python-error'></div>").text(error))
}
$("#input-textarea").on("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        $("#input-form").trigger("submit")
    }
});
window.addEventListener("message", async function (event) {
    if (event.data.reason !== "DELETE_MODULE") {
        return;
    }
    const modToDelete = event.data.moduleName;
    pyodide.runPythonAsync(`
import sys
if "${modToDelete.replace(".py", "")}" in sys.modules:
    del sys.modules["${modToDelete.replace(".py", "")}"]
`)
    const stat = pyodide.FS.stat("/" + modToDelete);
    if (pyodide.FS.isFile(stat.mode)) {
        pyodide.FS.unlink("/" + modToDelete);
    } else {
        console.warn("The module told to delete does not exist. The name is: ", modToDelete)
    }
})
window.addEventListener("message", async function (event) {
    if (event.data.reason !== "RUN_CODE") {
        return;
    }
    $("#result").empty();
    const pythonModules = event.data.modules;
    const newInputFunc = `
# Redefine the input() function
def input(text=''):
    import js
    from pyodide.ffi import jsnull
    result = js.prompt(text)
    if result is jsnull:
        return ""
    return result

`
    const numNewlines = newInputFunc.match(/\n/g || []).length;
    for (const moduleName in pythonModules) {
        const moduleCode = pythonModules[moduleName];
        pyodide.FS.writeFile("/" + moduleName, newInputFunc + moduleCode, {encoding:"utf8"})
    }
    pyodide.runPython(`
import sys
import json
import os
import shutil
import importlib
if "/" not in sys.path:
    sys.path.append("/")
# Clear any cached modules
mods_list = json.loads('${JSON.stringify(Object.keys(pythonModules).map((value) => value.replace(/\.py$/, "")))}')
for name in list(sys.modules.keys()):
    name = name.split(".")[0]
    if name in mods_list:
        del sys.modules[name]
# Nuke the __pycache__ folder.
if os.path.exists("/__pycache__"):
    shutil.rmtree("/__pycache__")
sys.path_importer_cache.clear()
importlib.invalidate_caches()
`);
    try {
        await pyodide.runPythonAsync(`
import runpy
runpy.run_path('/main.py', run_name='__main__')
`)
    } catch (error) {
        if (error.name === "PythonError") {
            let formattedStr = 'Traceback: (most recent call last)\n File "main.py" ' + error.message.split(/File \"\/?main\.py\"/i).slice(1).join('\nFile "main.py"');
            /*
            We injected the input() function earlier into the python so that pyodide would cooperate- the only problem is that in case of an error, it messes up the line numbers.
            */
            const splitStrWithLineNums = formattedStr.split(/(?<=File \"\/?[\w\-]+\.py\"\s?,? line )(?=[0-9]+)/);
            const splitStr = formattedStr.split(/(?<=File \"\/?[\w\-]+\.py\"\s?,? line )[0-9]+/);
            let newStr = splitStr[0];
            for (let i = 1; i < splitStr.length; i++) {
                // Start at the 1 index so we can replace it.
                const lineNumber = parseInt(splitStrWithLineNums[i]);
                newStr = newStr + (lineNumber - numNewlines).toString() + splitStr[i];
            }
            formattedStr = newStr;
            onPythonError(formattedStr);
        } else {
            throw error;
        }
    } finally {
        // Clear out the files we just created.
        try {
            for (const moduleName in pythonModules) {
                const stat = pyodide.FS.stat("/" + moduleName);
                if (pyodide.FS.isFile(stat.mode)) {
                    pyodide.FS.unlink("/" + moduleName)
                } else {
                    console.warn("Failed to clear module " + moduleName + "!")
                }
            }
        } catch (error) {
            console.error(error)
        }
    }
});
    </script>
</body>

</html>
